<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="search-form">
  <div class="form-grid">
    <div class="field">
      <label for="flightNumber">
        <span class="label-icon">&#x2708;</span> Flight Number
      </label>
      <input
        id="flightNumber"
        type="text"
        formControlName="flightNumber"
        placeholder="e.g. AA123"
        autocomplete="off"
        [class.invalid]="flightNumber.invalid && flightNumber.touched"
      />
      <span class="error" *ngIf="flightNumber.touched && flightNumber.hasError('required')">
        Flight number is required.
      </span>
      <span class="error" *ngIf="flightNumber.touched && flightNumber.hasError('pattern')">
        Enter a valid flight number (e.g. AA123).
      </span>
    </div>

    <div class="field">
      <label for="date">
        <span class="label-icon">&#x1F4C5;</span> Travel Date
      </label>
      <input
        id="date"
        type="date"
        formControlName="date"
        [class.invalid]="date.invalid && date.touched"
      />
      <span class="error" *ngIf="date.touched && date.hasError('required')">
        Date is required.
      </span>
    </div>
  </div>

  <button type="submit" [disabled]="loading">
    <span *ngIf="loading" class="spinner"></span>
    <span *ngIf="!loading" class="btn-icon">&#x1F50D;</span>
    {{ loading ? 'Searching&#x2026;' : 'Search Flight' }}
  </button>
</form>
