<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="logo">✈ SkyRoute</span>
      <h2>Welcome back</h2>
      <p>Sign in to your account</p>
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com"
          [class.invalid]="email.touched && email.invalid" />
        <span class="err" *ngIf="email.touched && email.hasError('required')">Email is required.</span>
        <span class="err" *ngIf="email.touched && email.hasError('email')">Enter a valid email.</span>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••"
          [class.invalid]="password.touched && password.invalid" />
        <span class="err" *ngIf="password.touched && password.hasError('required')">Password is required.</span>
      </div>
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
    <p class="switch"><a routerLink="/">&#8592; Back to home</a></p>
  </div>
</div>
